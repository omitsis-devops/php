; Omitsis hardening defaults. The base image ships no php.ini, so without this
; file these settings stay at PHP's built-in defaults.

; Leave function arguments out of exception backtraces (php.ini-production
; default). Mitigates CVE-2026-129474 / GHSA-8mjj-2r7p-4hg2 (PHP 8.5 use-after-free
; in __call/__callStatic backtraces, RCE) and keeps arguments out of logs.
; Exists since PHP 7.4.
zend.exception_ignore_args = On
